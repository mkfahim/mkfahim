<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="70"
     viewBox="0 0 1200 70">

  <defs>
    <filter id="neonGlow"
            x="-20%"
            y="-20%"
            width="140%"
            height="160%">
      <feDropShadow
        dx="0"
        dy="0"
        stdDeviation="1.8"
        flood-color="#00FF41"
        flood-opacity="0.9" />

      <feDropShadow
        dx="0"
        dy="0"
        stdDeviation="4.5"
        flood-color="#00FF41"
        flood-opacity="0.55" />
    </filter>

    <clipPath id="clip-welcome">
      <rect x="0" y="0" width="0" height="70">
        <animate
          attributeName="width"
          dur="18s"
          repeatCount="indefinite"
          keyTimes="0;0.05;0.18;0.23;0.30;1"
          values="0;0;320;320;0;0" />
      </rect>
    </clipPath>

    <clipPath id="clip-tagline">
      <rect x="0" y="0" width="0" height="70">
        <animate
          attributeName="width"
          dur="18s"
          repeatCount="indefinite"
          keyTimes="0;0.30;0.52;0.78;0.82;1"
          values="0;0;1100;1100;0;0" />
      </rect>
    </clipPath>
  </defs>

  <text
    x="10"
    y="45"
    font-family="Consolas, Menlo, monospace"
    font-size="36"
    font-weight="700"
    fill="#00FF41"
    filter="url(#neonGlow)"
    clip-path="url(#clip-welcome)">
    Welcome Here!
  </text>

  <text
    x="10"
    y="45"
    font-family="Consolas, Menlo, monospace"
    font-size="36"
    font-weight="700"
    fill="#00FF41"
    filter="url(#neonGlow)"
    clip-path="url(#clip-tagline)">
    Logic to Silicon, Agentic AI for Semi-Design
  </text>
</svg>